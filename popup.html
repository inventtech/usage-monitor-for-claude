<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Usage Monitor for Claude</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --green: #10a37f;
      --yellow: #f59e0b;
      --red: #dc2626;
      --gray: #9ca3af;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1f2937;
        --fg: #f3f4f6;
        --muted: #9ca3af;
        --border: #374151;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--fg);
    }
    .header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }
    .plan {
      font-size: 11px;
      color: var(--muted);
    }
    .section {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .section:last-child { border-bottom: 0; }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .window {
      margin-bottom: 10px;
    }
    .window:last-child { margin-bottom: 0; }
    .window-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 12px;
    }
    .window-label { color: var(--muted); }
    .window-value { font-weight: 600; }
    .bar {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      transition: width 0.3s, background-color 0.3s;
      border-radius: 3px;
    }
    .reset {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }
    .status-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.green  { background: var(--green); }
    .dot.yellow { background: var(--yellow); }
    .dot.red    { background: var(--red); }
    .dot.gray   { background: var(--gray); }

    .incident {
      background: rgba(220, 38, 38, 0.1);
      border-left: 3px solid var(--red);
      padding: 8px 10px;
      margin-top: 8px;
      border-radius: 3px;
      font-size: 12px;
    }
    .incident-status {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 2px;
    }
    .error {
      background: rgba(220, 38, 38, 0.1);
      color: var(--red);
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.5;
    }
    .footer {
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border);
    }
    button {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: var(--border); }
    button.primary {
      background: var(--green);
      color: white;
      border-color: var(--green);
    }
    button.primary:hover { opacity: 0.9; }
    .updated {
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      padding: 6px;
    }
    a {
      color: var(--green);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Usage Monitor for Claude</h1>
    <span class="plan" id="plan"></span>
  </div>

  <div id="content"></div>

  <div class="updated" id="updated"></div>

  <div class="footer">
    <button id="refreshBtn">🔄 Refresh</button>
    <button id="optionsBtn">⚙️ Settings</button>
    <button class="primary" id="openClaudeBtn">📊 Open Usage Page</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
